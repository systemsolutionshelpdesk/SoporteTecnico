<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE6D6;
    --paper-dark: #E1D8C2;
    --ink: #2B2118;
    --ink-soft: #5B5142;
    --red: #B4472B;
    --green: #4B7F52;
    --line: #C9BE9F;
    --card: #F7F2E7;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,33,24,0.06) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 28px 14px 60px;
  }
  .ticket{
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 2px 0 var(--line), 0 18px 40px -20px rgba(43,33,24,0.4);
    position: relative;
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height: 10px;
    background:
      linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0/12px 12px repeat-x,
      linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0/12px 12px repeat-x;
    background-color: transparent;
  }
  .ticket::before{ top:-1px; }
  .ticket::after{ bottom:-1px; transform: scaleY(-1); }

  header{
    padding: 26px 26px 14px;
    text-align:center;
    border-bottom: 1px dashed var(--line);
  }
  .eyebrow{
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .live-dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--green);
    display:inline-block;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.35; }
  }
  h1{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 44px;
    margin: 4px 0 6px;
    color: var(--red);
    transform: rotate(-1deg);
  }
  .fecha-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 6px;
  }
  .fecha-btn{
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-bottom: 1px dotted var(--ink-soft);
    cursor: pointer;
    padding: 2px 0;
  }
  .fecha-btn:hover{ color: var(--ink); border-color: var(--ink); }
  input[type="date"]{
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    background: var(--paper-dark);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 3px 5px;
  }

  .tabs-wrap{
    display:flex;
    align-items:center;
    gap: 6px;
    padding: 14px 20px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-wrap::-webkit-scrollbar{ display:none; }
  .tab{
    flex: none;
    display:flex;
    align-items:center;
    gap: 4px;
    font-size: 11px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-bottom: none;
    background: var(--paper-dark);
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    border-radius: 6px 6px 0 0;
  }
  .tab.active{
    background: var(--card);
    color: var(--ink);
    border-color: var(--line);
    font-weight: 700;
  }
  .tab .x{
    color: var(--red);
    font-size: 11px;
    padding: 0 2px;
  }
  .tab-add{
    flex: none;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 10px;
    border: 1px dashed var(--line);
    border-bottom: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 6px 6px 0 0;
  }
  .tab-add:hover{ color: var(--red); border-color: var(--red); }

  .add-row{
    display:flex;
    gap: 8px;
    padding: 14px 22px 12px;
    border-top: 1px solid var(--line);
    border-bottom: 1px dashed var(--line);
  }
  .add-row input[type=text]{
    flex: 1;
    font-family: 'Caveat', cursive;
    font-size: 22px;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--ink);
    padding: 4px 2px;
    color: var(--ink);
    outline: none;
  }
  .add-row input[type=text]::placeholder{ color: #9c8f78; }
  .add-row select{
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    background: var(--paper-dark);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 0 6px;
  }
  .add-row button{
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    background: var(--red);
    color: var(--card);
    border: none;
    padding: 0 16px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .add-row button:active{ transform: translateY(1px); }

  .categorias{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 22px 4px;
  }
  .chip{
    font-size: 10px;
    letter-spacing: .5px;
    padding: 3px 9px;
    border: 1px solid var(--line);
    border-radius: 20px;
    color: var(--ink-soft);
    cursor: pointer;
    background: var(--paper-dark);
    user-select:none;
  }
  .chip.active{
    background: var(--ink);
    color: var(--card);
    border-color: var(--ink);
  }

  .lista{
    list-style:none;
    margin:0;
    padding: 8px 10px 18px;
    min-height: 60px;
  }
  .vacio{
    text-align:center;
    padding: 30px 10px 10px;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .vacio span{
    display:block;
    font-family:'Caveat', cursive;
    font-size: 26px;
    color: var(--red);
    margin-bottom: 4px;
  }
  .item{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 9px 12px;
    border-bottom: 1px dotted var(--line);
  }
  .item .box{
    width: 20px; height: 20px;
    border: 2px solid var(--ink);
    flex: none;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    color: var(--card);
    font-size: 13px;
    font-weight:700;
  }
  .item.done .box{ background: var(--green); border-color: var(--green); }
  .item .nombre{
    flex:1;
    font-size: 15px;
    cursor: pointer;
  }
  .item.done .nombre{
    text-decoration: line-through wavy var(--red);
    color: var(--ink-soft);
  }
  .item .tag{
    font-size: 9px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 1px 6px;
    border-radius: 20px;
    white-space:nowrap;
  }
  .item .del{
    background:none;
    border:none;
    color: var(--red);
    font-size: 16px;
    cursor:pointer;
    padding: 0 2px;
    line-height:1;
  }

  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 12px 22px 22px;
    font-size: 11px;
    color: var(--ink-soft);
    gap: 8px;
    flex-wrap: wrap;
  }
  footer button{
    background:none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family:'Space Mono', monospace;
    font-size: 10px;
    padding: 5px 10px;
    cursor:pointer;
  }
  footer button:hover{ border-color: var(--ink); color: var(--ink); }

  @media (prefers-reduced-motion: no-preference){
    .item{ animation: aparecer .18s ease; }
    @keyframes aparecer{
      from{ opacity:0; transform: translateY(-4px); }
      to{ opacity:1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>

<div class="ticket">
  <header>
    <div class="eyebrow"><span class="live-dot"></span>Almacén &amp; despensa · en vivo</div>
    <h1>Lista de compras</h1>
    <div class="fecha-wrap" id="fecha-wrap"></div>
  </header>

  <div class="tabs-wrap" id="tabs-wrap"></div>

  <form class="add-row" id="form-agregar">
    <input type="text" id="input-producto" placeholder="¿Qué falta?" autocomplete="off" />
    <select id="select-categoria">
      <option value="Almacén">Almacén</option>
      <option value="Verdulería">Verdulería</option>
      <option value="Carnicería">Carnicería</option>
      <option value="Fiambrería">Fiambrería</option>
      <option value="Panadería">Panadería</option>
      <option value="Lácteos">Lácteos</option>
      <option value="Bebidas">Bebidas</option>
      <option value="Congelados">Congelados</option>
      <option value="Limpieza">Limpieza</option>
      <option value="Higiene">Higiene</option>
      <option value="Mascotas">Mascotas</option>
      <option value="Otros">Otros</option>
    </select>
    <button type="submit">+ Agregar</button>
  </form>

  <div class="categorias" id="filtros"></div>

  <ul class="lista" id="lista"></ul>

  <footer>
    <span id="contador">0 productos</span>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button id="btn-limpiar-tildados">Borrar tildados</button>
      <button id="btn-limpiar-todo">Vaciar esta lista</button>
    </div>
  </footer>
</div>

<script>
const CATS = ["Almacén","Verdulería","Carnicería","Fiambrería","Panadería","Lácteos","Bebidas","Congelados","Limpieza","Higiene","Mascotas","Otros"];
const STORAGE_KEY = "shopping-lists-data";
const SHARED = true; // la lista es visible y editable por cualquiera que abra este artefacto
const POLL_MS = 3000;

let listas = [];        // [{id, fecha:'YYYY-MM-DD', items:[{id,nombre,cat,done}]}]
let listaActualId = null;
let filtro = "Todos";
let editandoFecha = false;
let ultimoJSON = "";    // para detectar cambios remotos sin pisar lo que estoy escribiendo

const $lista = document.getElementById("lista");
const $form = document.getElementById("form-agregar");
const $input = document.getElementById("input-producto");
const $select = document.getElementById("select-categoria");
const $contador = document.getElementById("contador");
const $filtros = document.getElementById("filtros");
const $fechaWrap = document.getElementById("fecha-wrap");
const $tabsWrap = document.getElementById("tabs-wrap");

function uid(){ return Math.random().toString(36).slice(2,9); }
function hoyISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0,10);
}
function formatoLargo(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
}
function formatoCorto(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('es-AR', { day:'numeric', month:'short' });
}

function listaActual(){
  return listas.find(l => l.id === listaActualId) || listas[0];
}

async function cargar(inicial){
  try{
    const res = await window.storage.get(STORAGE_KEY, SHARED);
    const data = res && res.value ? JSON.parse(res.value) : null;
    if(data && data.listas && data.listas.length){
      const nuevoJSON = JSON.stringify(data);
      if(nuevoJSON === ultimoJSON) return; // nada cambió, no re-renderizar
      ultimoJSON = nuevoJSON;
      listas = data.listas;
      listaActualId = data.listaActualId && listas.some(l=>l.id===data.listaActualId)
        ? data.listaActualId
        : listas[0].id;
    } else if(inicial){
      listas = [{ id: uid(), fecha: hoyISO(), items: [] }];
      listaActualId = listas[0].id;
      ultimoJSON = JSON.stringify({ listas, listaActualId });
    } else {
      return;
    }
  }catch(e){
    if(inicial){
      listas = [{ id: uid(), fecha: hoyISO(), items: [] }];
      listaActualId = listas[0].id;
      ultimoJSON = JSON.stringify({ listas, listaActualId });
    } else {
      return;
    }
  }
  render();
}

async function guardar(){
  try{
    const payload = { listas, listaActualId };
    ultimoJSON = JSON.stringify(payload);
    await window.storage.set(STORAGE_KEY, JSON.stringify(payload), SHARED);
  }catch(e){
    console.error("No se pudo guardar", e);
  }
}

function renderFecha(){
  const l = listaActual();
  if(editandoFecha){
    $fechaWrap.innerHTML = `<input type="date" id="input-fecha" value="${l.fecha}" />`;
    const $inputFecha = document.getElementById("input-fecha");
    $inputFecha.focus();
    $inputFecha.addEventListener("change", ()=>{
      l.fecha = $inputFecha.value || hoyISO();
      editandoFecha = false;
      render();
      guardar();
    });
    $inputFecha.addEventListener("blur", ()=>{
      editandoFecha = false;
      render();
    });
  } else {
    $fechaWrap.innerHTML = `<button class="fecha-btn" id="btn-fecha">${formatoLargo(l.fecha)} · editar fecha</button>`;
    document.getElementById("btn-fecha").addEventListener("click", ()=>{
      editandoFecha = true;
      renderFecha();
    });
  }
}

function renderTabs(){
  const tabsHtml = listas.map(l => {
    const activa = l.id === listaActualId;
    const puedeBorrar = listas.length > 1;
    return `<div class="tab ${activa?'active':''}" data-id="${l.id}">
      <span data-action="switch">${formatoCorto(l.fecha)}</span>
      ${puedeBorrar ? `<span class="x" data-action="del" title="Eliminar esta lista">✕</span>` : ``}
    </div>`;
  }).join("");
  $tabsWrap.innerHTML = tabsHtml + `<button class="tab-add" id="btn-nueva-lista" title="Nueva lista">+</button>`;

  $tabsWrap.querySelectorAll(".tab").forEach(tab=>{
    const id = tab.dataset.id;
    tab.querySelector('[data-action="switch"]').addEventListener("click", ()=>{
      listaActualId = id;
      filtro = "Todos";
      editandoFecha = false;
      render();
      guardar();
    });
    const delBtn = tab.querySelector('[data-action="del"]');
    if(delBtn){
      delBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        if(!confirm("¿Eliminar esta lista guardada? (afecta a todos)")) return;
        listas = listas.filter(l=>l.id!==id);
        if(listaActualId === id){
          listaActualId = listas[0].id;
        }
        render();
        guardar();
      });
    }
  });

  document.getElementById("btn-nueva-lista").addEventListener("click", ()=>{
    const nueva = { id: uid(), fecha: hoyISO(), items: [] };
    listas.unshift(nueva);
    listaActualId = nueva.id;
    filtro = "Todos";
    render();
    guardar();
  });
}

function renderFiltros(){
  const cats = ["Todos", ...CATS];
  $filtros.innerHTML = cats.map(c =>
    `<span class="chip ${c===filtro ? 'active':''}" data-cat="${c}">${c}</span>`
  ).join("");
  $filtros.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      filtro = chip.dataset.cat;
      render();
    });
  });
}

function render(){
  const l = listaActual();
  if(!l) return;
  renderFecha();
  renderTabs();
  renderFiltros();

  const visibles = l.items.filter(it => filtro === "Todos" || it.cat === filtro);

  if(visibles.length === 0){
    $lista.innerHTML = `<div class="vacio"><span>Nada por acá</span>Agregá lo que necesitás comprar arriba.</div>`;
  } else {
    $lista.innerHTML = visibles.map(it => `
      <li class="item ${it.done ? 'done':''}" data-id="${it.id}">
        <div class="box" data-action="toggle">${it.done ? '✓' : ''}</div>
        <div class="nombre" data-action="toggle">${escapeHtml(it.nombre)}</div>
        <span class="tag">${it.cat}</span>
        <button class="del" data-action="del" aria-label="Borrar">✕</button>
      </li>
    `).join("");
  }

  const pendientes = l.items.filter(it => !it.done).length;
  $contador.textContent = `${pendientes} pendiente${pendientes===1?'':'s'} · ${l.items.length} en total`;

  $lista.querySelectorAll(".item").forEach(li=>{
    const id = li.dataset.id;
    li.querySelectorAll('[data-action="toggle"]').forEach(el=>{
      el.addEventListener("click", ()=> toggle(id));
    });
    li.querySelector('[data-action="del"]').addEventListener("click", ()=> borrar(id));
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function toggle(id){
  const l = listaActual();
  const it = l.items.find(i=>i.id===id);
  if(it){ it.done = !it.done; render(); guardar(); }
}

function borrar(id){
  const l = listaActual();
  l.items = l.items.filter(i=>i.id!==id);
  render(); guardar();
}

$form.addEventListener("submit", (e)=>{
  e.preventDefault();
  const nombre = $input.value.trim();
  if(!nombre) return;
  const l = listaActual();
  l.items.unshift({ id: uid(), nombre, cat: $select.value, done: false });
  $input.value = "";
  $input.focus();
  render();
  guardar();
});

document.getElementById("btn-limpiar-tildados").addEventListener("click", ()=>{
  const l = listaActual();
  l.items = l.items.filter(i=>!i.done);
  render(); guardar();
});

document.getElementById("btn-limpiar-todo").addEventListener("click", ()=>{
  const l = listaActual();
  if(l.items.length && !confirm("¿Vaciar esta lista? (afecta a todos)")) return;
  l.items = [];
  render(); guardar();
});

// No refrescar mientras el usuario está escribiendo el nombre del producto o editando la fecha
function puedeRefrescar(){
  return document.activeElement !== $input && !editandoFecha;
}

cargar(true);
setInterval(()=>{
  if(puedeRefrescar()) cargar(false);
}, POLL_MS);

</script>

</body>
</html>
